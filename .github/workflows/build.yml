name: Build WirePro APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install Android SDK Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "build-tools;33.0.2" "platforms;android-33" "platform-tools"
          sdkmanager --list_installed
          ls -l $ANDROID_HOME/build-tools/33.0.2/aidl || ls -l $ANDROID_SDK_ROOT/build-tools/33.0.2/aidl
      - name: Install Buildozer
        run: pip install buildozer cython==0.29.33
      - name: Build APK
        run: buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WirePro-APK
          path: bin/*.apk
