name: Build WirePro APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: 3.10
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt-get install -y python3-pip build-essential git python3 python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.33
      - name: Init buildozer if needed
        run: |
          ls -la
          if [ ! -f buildozer.spec ]; then buildozer init; sed -i 's/title = My Application/title = WirePro/' buildozer.spec; sed -i 's/package.name = myapp/package.name = wirepro/' buildozer.spec; fi
          cat buildozer.spec | head -n 30
      - name: Build APK
        run: |
          buildozer -v android debug
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WirePro-APK
          path: bin/*.apk
